[package]
name = "q_terminal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Guilherme Fortuna <guilhermefortuna.dev@gmail.com>"]

[dependencies]
cxx = "1.0.142"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
q-qt = { git = "https://github.com/GuilhermeFortuna/q_core.git", tag = "v2026.09.16", package = "q-qt" }
q-buffers = { git = "https://github.com/GuilhermeFortuna/q_core.git", tag = "v2026.09.16", package = "q-buffers" }
q-io = { git = "https://github.com/GuilhermeFortuna/q_core.git", tag = "v2026.09.16", package = "q-io" }
tokio = { version = "1.43", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
arrow = { version = "60.0.0", default-features = false, features = ["ipc"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tempfile = "3"
arrow = { version = "60.0.0", default-features = false, features = ["ipc"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "zstd", "lz4_flex", "flate2-zlib-rs", "brotli"] }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
qt-build-utils = { version = "0.10.0", features = ["qt_minimal"] }
qt-version = { version = "0.1.5", features = ["qt_version_at_least_6_5"] }
q-qt = { git = "https://github.com/GuilhermeFortuna/q_core.git", tag = "v2026.09.16", package = "q-qt" }


[lints.clippy]
float_cmp = "deny"
float_cmp_const = "deny"
imprecise_flops = "deny"
suboptimal_flops = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
