name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Restore Rust and Qt build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-directories: ~/.local/share/qt_minimal_download

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0t64 libdouble-conversion3 libpcre2-16-0 libgl1-mesa-dev qt6-declarative-dev-tools lld

      - name: Run validation suite
        run: make check
